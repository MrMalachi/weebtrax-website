<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>WeebTrax</title>
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    @font-face {
      font-family: 'Love Letter TW';
      src: url('fonts/loveletter.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --void:   #0a0b0e;
      --line:   rgba(214,209,198,0.20);
      --line2:  rgba(214,209,198,0.38);
      --ink:    #e6e1d4;
      --body:   rgba(230,225,212,0.86);
      --dim:    rgba(230,225,212,0.64);
      --faint:  rgba(230,225,212,0.44);
      --ghost:  rgba(230,225,212,0.20);
      --green:  #8fbf9f;
      --mono:   'IBM Plex Mono', ui-monospace, monospace;
    }

    html, body {
      height: 100%;
      background: var(--void);
      color: var(--body);
      font-family: var(--mono);
      overflow: hidden;
    }

    /* scan lines */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.07) 2px,
        rgba(0,0,0,0.07) 4px
      );
      pointer-events: none;
      z-index: 100;
    }

    .page {
      height: 100vh;
      height: 100svh;
      display: flex;
      flex-direction: column;
    }

    /* ── top bar ── */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 24px;
      border-bottom: 1px solid var(--line2);
      flex-shrink: 0;
    }

    .topbar-logo {
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 5px;
      color: var(--green);
      text-shadow: 0 0 14px rgba(143,191,159,0.45);
      text-transform: uppercase;
    }

    .topbar-center {
      font-size: 8.5px;
      letter-spacing: 2px;
      color: var(--ghost);
      text-transform: uppercase;
    }

    .topbar-node {
      font-size: 8.5px;
      letter-spacing: 2px;
      color: var(--dim);
      text-transform: uppercase;
    }

    /* ── main ── */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 36px;
      padding: 24px;
    }

    .eyebrow {
      font-size: 8.5px;
      letter-spacing: 4px;
      color: var(--faint);
      text-transform: uppercase;
    }

    .headline {
      font-family: 'Love Letter TW', 'Special Elite', 'IBM Plex Mono', monospace;
      font-size: 28px;
      letter-spacing: 4px;
      color: var(--green);
      text-transform: uppercase;
      text-shadow: 0 0 10px rgba(143,191,159,0.35);
      animation: flicker 5s ease-in-out infinite;
    }

    @keyframes flicker {
      0%, 94%, 96%, 98%, 100% { opacity: 1; }
      95% { opacity: 0.3; }
      97% { opacity: 0.7; }
      99% { opacity: 0.5; }
    }

    /* ── countdown frame ── */
    .frame {
      position: relative;
      padding: 36px 48px;
    }

    /* corner ticks — pseudo-elements handle TL and TR */
    .frame::before, .frame::after,
    .tick-bl, .tick-br {
      position: absolute;
      width: 10px;
      height: 10px;
      border-color: var(--line2);
      border-style: solid;
    }
    .frame::before { content: ''; top: 0; left: 0;  border-width: 1px 0 0 1px; }
    .frame::after  { content: ''; top: 0; right: 0; border-width: 1px 1px 0 0; }
    .tick-bl { bottom: 0; left: 0;  border-width: 0 0 1px 1px; }
    .tick-br { bottom: 0; right: 0; border-width: 0 1px 1px 0; }

    .countdown {
      display: flex;
      align-items: flex-start;
      gap: 16px;
    }

    .unit {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      min-width: 88px;
    }

    .unit-value {
      font-size: 64px;
      font-weight: 300;
      letter-spacing: -3px;
      color: var(--ink);
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .unit-label {
      font-size: 7.5px;
      letter-spacing: 3px;
      color: var(--ghost);
      text-transform: uppercase;
    }

    .sep {
      font-size: 48px;
      font-weight: 300;
      color: var(--line2);
      line-height: 1;
      margin-top: 6px;
    }

    /* ── target date ── */
    .target-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .target-label {
      font-size: 7.5px;
      letter-spacing: 4px;
      color: var(--ghost);
      text-transform: uppercase;
    }

    .target-value {
      font-size: 16px;
      letter-spacing: 5px;
      color: var(--ink);
      text-transform: uppercase;
      text-shadow: 0 0 18px rgba(230,225,212,0.18), 0 0 4px rgba(230,225,212,0.1);
      font-weight: 300;
    }

    .target-bracket {
      color: var(--line2);
      font-weight: 400;
    }

    /* ── bottom bar ── */
    .bottombar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 24px;
      padding-bottom: max(14px, env(safe-area-inset-bottom));
      border-top: 1px solid var(--line2);
      flex-shrink: 0;
    }

    .bottombar-left {
      font-size: 11px;
      letter-spacing: 3px;
      color: var(--green);
      text-shadow: 0 0 12px rgba(143,191,159,0.6);
      text-transform: uppercase;
    }

    .bottombar-right {
      font-size: 11px;
      letter-spacing: 3px;
      color: var(--green);
      text-shadow: 0 0 12px rgba(143,191,159,0.6);
      text-transform: uppercase;
    }

    .cursor {
      animation: blink 1.1s step-start infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0; }
    }

    /* ── responsive ── */
    @media (max-width: 600px) {
      .topbar { padding: 12px 16px; }
      .topbar-center { display: none; }
      .main { gap: 20px; padding: 16px 16px 16px; }
      .headline { font-size: 22px; letter-spacing: 3px; }
      .frame { padding: 20px 16px; }
      .countdown { gap: 6px; }
      .unit  { min-width: 54px; gap: 8px; }
      .unit-value { font-size: 40px; letter-spacing: -1px; }
      .sep   { font-size: 28px; margin-top: 4px; }
      .target-value { font-size: 13px; letter-spacing: 3px; }
      .bottombar { padding: 12px 16px; }
    }

    @media (max-width: 380px) {
      .headline { font-size: 18px; letter-spacing: 2px; }
      .main { gap: 16px; }
      .frame { padding: 14px 10px; }
      .countdown { gap: 4px; }
      .unit  { min-width: 44px; }
      .unit-value { font-size: 32px; letter-spacing: -1px; }
      .sep   { font-size: 22px; }
      .target-value { font-size: 11px; letter-spacing: 2px; }
    }

    @media (max-width: 320px) {
      .unit  { min-width: 36px; }
      .unit-value { font-size: 26px; }
      .sep   { font-size: 18px; }
      .headline { font-size: 15px; }
    }
  </style>
  <!-- Analytics removed 2026-08-29: the self-hosted Umami instance on Railway went
       away with the expired trial, so its script.js was 404ing on every page load.
       Old website id was b3e9a766-c21b-4acb-8b35-bf120b3f2aef. Replace with
       Cloudflare Web Analytics (or Umami Cloud) before launch. -->
</head>
<body>
<div class="page">

  <div class="topbar">
    <div class="topbar-logo">WEEBTRAX</div>
    <div class="topbar-center">SIGNAL INCOMING</div>
    <div class="topbar-node">NODE.WT2</div>
  </div>

  <div class="main">
    <div class="eyebrow">// TRANSMISSION PENDING</div>

    <div class="headline" id="headline">FROM CLUB CYBERIA</div>

    <div class="frame">
      <div class="tick-bl"></div>
      <div class="tick-br"></div>
      <div class="countdown">
        <div class="unit">
          <div class="unit-value" id="days">00</div>
          <div class="unit-label">DAYS</div>
        </div>
        <div class="sep">:</div>
        <div class="unit">
          <div class="unit-value" id="hours">00</div>
          <div class="unit-label">HRS</div>
        </div>
        <div class="sep">:</div>
        <div class="unit">
          <div class="unit-value" id="minutes">00</div>
          <div class="unit-label">MIN</div>
        </div>
        <div class="sep">:</div>
        <div class="unit">
          <div class="unit-value" id="seconds">00</div>
          <div class="unit-label">SEC</div>
        </div>
      </div>
    </div>

    <div class="target-wrap">
      <div class="target-label">LAUNCH TARGET</div>
      <div class="target-value">
        <span class="target-bracket">[ </span><span id="target-display"></span><span class="target-bracket"> ]</span>
      </div>
    </div>
  </div>

  <div class="bottombar">
    <div class="bottombar-left">LET THERE BE HOUSE</div>
    <div class="bottombar-right">STANDBY <span class="cursor">▮</span></div>
  </div>

</div>

<script>
  // ─── SET YOUR LAUNCH DATE HERE ─────────────────────────────────────────────
  // Offset is required. Without one the date is parsed in each visitor's own
  // timezone, so the countdown would hit zero at a different real-world moment
  // for every region. -04:00 is US Eastern during daylight saving (Mar-Nov);
  // it becomes -05:00 in the winter.
  const LAUNCH_DATE = new Date('2026-08-29T12:30:00-04:00');
  // ───────────────────────────────────────────────────────────────────────────

  const MONTHS = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  const pad = n => String(n).padStart(2, '0');

  document.getElementById('target-display').textContent =
    pad(LAUNCH_DATE.getDate()) + ' ' +
    MONTHS[LAUNCH_DATE.getMonth()] + ' ' + LAUNCH_DATE.getFullYear();

  function tick() {
    const diff = LAUNCH_DATE - Date.now();

    if (diff <= 0) {
      ['days','hours','minutes','seconds'].forEach(id => {
        document.getElementById(id).textContent = '00';
      });
      document.getElementById('headline').textContent = 'SIGNAL LIVE';
      document.querySelector('.bottombar-right').innerHTML =
        'ONLINE <span style="color:var(--green)">▮</span>';
      return;
    }

    const days    = Math.floor(diff / 864e5);
    const hours   = Math.floor((diff % 864e5) / 36e5);
    const minutes = Math.floor((diff % 36e5) / 6e4);
    const seconds = Math.floor((diff % 6e4) / 1e3);

    document.getElementById('days').textContent    = pad(days);
    document.getElementById('hours').textContent   = pad(hours);
    document.getElementById('minutes').textContent = pad(minutes);
    document.getElementById('seconds').textContent = pad(seconds);
  }

  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
