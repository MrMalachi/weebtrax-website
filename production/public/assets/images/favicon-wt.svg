<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <style>
      @font-face {
        font-family: 'JBMono';
        src: url('data:font/truetype;base64,') format('truetype');
        font-weight: 700;
      }
    </style>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- corner ticks -->
  <polyline points="3,8 3,3 8,3" fill="none" stroke="#8fbf9f" stroke-width="1" opacity="0.7"/>
  <polyline points="24,29 29,29 29,24" fill="none" stroke="#8fbf9f" stroke-width="1" opacity="0.7"/>
  <!-- WT text with glow -->
  <text x="16" y="21" text-anchor="middle" font-family="JBMono" font-weight="700" font-size="13" fill="#8fbf9f" filter="url(#glow)">WT</text>
</svg>