<!DOCTYPE html>
<html lang="en" style="background-color:#0a0b0e">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#8fbf9f">
  <meta name="color-scheme" content="dark">
  <title>WeebTrax — SIGNAL LOST</title>
  <link rel="icon" href="/public/assets/images/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/public/assets/images/favicon-32x32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="/public/assets/images/favicon-16x16.png" type="image/png" sizes="16x16">
  <link rel="apple-touch-icon" sizes="180x180" href="/public/assets/images/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --void:  #0a0b0e;
      --line2: rgba(214,209,198,0.38);
      --ink:   #e6e1d4;
      --body:  rgba(230,225,212,0.86);
      --dim:   rgba(230,225,212,0.64);
      --faint: rgba(230,225,212,0.44);
      --ghost: rgba(230,225,212,0.20);
      --green: #8fbf9f;
      --mono:  'IBM Plex Mono', ui-monospace, monospace;
    }

    html, body {
      min-height: 100%;
      background: var(--void);
      color: var(--body);
      font-family: var(--mono);
    }

    /* scan lines — same treatment as the countdown page */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        transparent, transparent 2px,
        rgba(0,0,0,0.07) 2px, rgba(0,0,0,0.07) 4px
      );
      pointer-events: none;
      z-index: 100;
    }

    .page {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
    }

    .topbar, .bottombar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 24px;
      flex-shrink: 0;
    }
    .topbar    { border-bottom: 1px solid var(--line2); }
    .bottombar {
      border-top: 1px solid var(--line2);
      padding-bottom: max(14px, env(safe-area-inset-bottom));
    }

    .logo {
      font-size: 13px;
      letter-spacing: 5px;
      color: var(--green);
      text-shadow: 0 0 14px rgba(143,191,159,0.45);
      text-transform: uppercase;
      text-decoration: none;
    }

    .node {
      font-size: 8.5px;
      letter-spacing: 2px;
      color: var(--dim);
      text-transform: uppercase;
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 26px;
      padding: 40px 24px;
      text-align: center;
    }

    .eyebrow {
      font-size: 8.5px;
      letter-spacing: 4px;
      color: var(--faint);
      text-transform: uppercase;
    }

    .code {
      font-size: 96px;
      font-weight: 300;
      letter-spacing: -2px;
      line-height: 1;
      color: var(--ink);
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 28px rgba(230,225,212,0.14);
      animation: flicker 5s ease-in-out infinite;
    }

    @keyframes flicker {
      0%, 94%, 96%, 98%, 100% { opacity: 1; }
      95% { opacity: 0.35; }
      97% { opacity: 0.75; }
      99% { opacity: 0.55; }
    }

    .headline {
      font-size: 15px;
      letter-spacing: 4px;
      color: var(--green);
      text-transform: uppercase;
      text-shadow: 0 0 10px rgba(143,191,159,0.35);
    }

    .blurb {
      font-size: 12px;
      line-height: 1.8;
      color: var(--dim);
      max-width: 46ch;
    }

    .path {
      font-size: 11px;
      color: var(--ghost);
      word-break: break-all;
      max-width: 46ch;
    }

    .cta {
      display: inline-block;
      margin-top: 4px;
      padding: 11px 22px;
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--green);
      border: 1px solid var(--line2);
      background: transparent;
      transition: background 0.18s ease, border-color 0.18s ease;
    }

    /* hover only on devices that really hover — touch devices otherwise
       get stuck in the hovered state after a tap */
    @media (hover: hover) {
      .cta:hover {
        background: rgba(143,191,159,0.10);
        border-color: var(--green);
      }
    }

    .cursor { animation: blink 1.1s step-start infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

    @media (max-width: 600px) {
      .topbar, .bottombar { padding: 12px 16px; }
      .code     { font-size: 64px; }
      .headline { font-size: 13px; letter-spacing: 3px; }
      .main     { gap: 20px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="topbar">
      <a class="logo" href="/">WeebTrax</a>
      <span class="node">NODE.404</span>
    </div>

    <div class="main">
      <div class="eyebrow">ERROR .404 &nbsp;//&nbsp; NO SUCH TRANSMISSION</div>
      <div class="code">404</div>
      <h1 class="headline">Signal Lost</h1>
      <p class="blurb">
        This address doesn't resolve to anything on the wired.
        The transmission may have been moved, or it never existed.
      </p>
      <p class="path" id="path"></p>
      <a class="cta" href="/">&#9666; Return to the archive</a>
    </div>

    <div class="bottombar">
      <span class="node">wired://weebtrax/lost</span>
      <span class="node">CONNECTION IDLE <span class="cursor">&#9646;</span></span>
    </div>
  </div>

  <script>
    // Show the address that failed, so a mistyped or stale link is obvious.
    // textContent, never innerHTML — the path is attacker-controlled input.
    var p = document.getElementById('path');
    if (p) p.textContent = location.pathname + location.search;
  </script>
</body>
</html>
